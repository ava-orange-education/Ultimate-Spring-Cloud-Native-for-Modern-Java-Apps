spring:
  application:
    name: campusflow-config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Default relative path assumes the process is started from config-server/
          search-locations: ${CONFIG_SEARCH_LOCATION:file:${user.dir}/../config-repo}

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: CampusFlow Config Server
    description: Minimal Spring Cloud Config Server (native filesystem backend)
    version: 0.1.0

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO
