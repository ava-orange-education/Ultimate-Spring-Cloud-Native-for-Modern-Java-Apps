services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  campusflow-monolith:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CAMPUSFLOW_DB_URL: jdbc:postgresql://postgres:5432/campusflow
      CAMPUSFLOW_DB_USER: campusflow
      CAMPUSFLOW_DB_PASSWORD: campusflow
      CAMPUSFLOW_SCHOOL_NAME: CampusFlow Academy (Docker)
    depends_on:
      postgres:
        condition: service_healthy
