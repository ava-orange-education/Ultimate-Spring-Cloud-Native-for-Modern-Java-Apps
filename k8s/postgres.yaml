apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: campusflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: campusflow
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campusflow-monolith-secret
                  key: CAMPUSFLOW_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusflow-monolith-secret
                  key: CAMPUSFLOW_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: campusflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
