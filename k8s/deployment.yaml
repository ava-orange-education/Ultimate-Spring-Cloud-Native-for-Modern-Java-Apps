apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusflow-monolith
  namespace: campusflow
  labels:
    app: campusflow-monolith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campusflow-monolith
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: campusflow-monolith
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: campusflow-monolith
          image: campusflow/monolith:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: campusflow-monolith-config
            - secretRef:
                name: campusflow-monolith-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
