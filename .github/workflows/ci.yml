name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-monolith:
    name: Test monolith-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Build and test monolith
        working-directory: monolith-baseline
        run: mvn -B verify

  test-config-server:
    name: Test config-server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test config server
        working-directory: config-server
        run: mvn -B verify

  build-container-image:
    name: Build container image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-monolith, test-config-server]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: >
          docker build -f docker/Dockerfile
          -t campusflow/monolith:ci
          -t campusflow/monolith:${{ github.sha }}
          .
