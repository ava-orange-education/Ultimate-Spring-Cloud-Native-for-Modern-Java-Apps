name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusflow
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test monolith
        working-directory: monolith-baseline
        env:
          CAMPUSFLOW_DB_URL: jdbc:postgresql://localhost:5432/campusflow
          CAMPUSFLOW_DB_USER: campusflow
          CAMPUSFLOW_DB_PASSWORD: campusflow
        run: mvn -B verify

      - name: Build and test config server
        working-directory: config-server
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t campusflow/monolith:ci .
